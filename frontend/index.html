<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Meshtastic Mapper</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
    <div id="map"></div>
    <div id="stats" class="open" onclick="if(event.target.tagName!=='INPUT'&&event.target.tagName!=='A')this.classList.toggle('open')">
        <h3>📶 Mesh Stats ▼</h3>
        <div id="stats-content">
        <small style="color:#888">v1.5</small><br>
        <b>Nodes:</b> <span id="cnt">0</span><br>
        <b>Routers:</b> <span id="routers">0</span> | <b>Clients:</b> <span id="clients">0</span><br>
        <b>Direct:</b> <span id="direct">0</span> | <b>Relay:</b> <span id="relay">0</span><br>
        <b>Avg SNR:</b> <span id="avgsnr">-</span> dB<br>
        <b>Max range:</b> <span id="maxrange">-</span> km <a href="#" id="maxrange-link" style="font-size:11px;display:none;">(→ pokaż)</a><br>
        <hr style="margin:5px 0">
        <small><b>Tracker:</b> <span id="tracker-model">-</span></small><br>
        <small><b>Firmware:</b> <span id="tracker-fw">-</span></small><br>
        <small><b>ID:</b> <span id="tracker-id">-</span></small><br>
        <small><b>Port:</b> <span id="tracker-port">-</span></small><br>
        <hr style="margin:5px 0">
        <hr style="margin:5px 0">
        <label style="font-size:11px;cursor:pointer;">
            <input type="checkbox" id="filter-direct" onchange="update()"> Show only direct (hops=0)
        </label><br>
        <small>Update: <span id="upd">-</span></small><br>
        </div>
    </div>
    <div id="no-gps-panel" class="open" onclick="this.classList.toggle('open')">
        <h4>📍 No GPS ▼ (<span id="no-gps-cnt">0</span>)</h4>
        <div id="no-gps-content">
        <div id="no-gps-list"></div>
        </div>
    </div>
    <div id="legend" onclick="this.classList.toggle('open')">
    <h4>📋 Legend ▼</h4>
    <div id="legend-content">
        <div class="section">NODE AGE</div>
        <div class="row"><div class="sample circle green"></div> &lt; 1 hour</div>
        <div class="row"><div class="sample circle yellow"></div> 1-6 hours</div>
        <div class="row"><div class="sample circle red"></div> &gt; 6 hours</div>
        
        <div class="section">ROLE</div>
        <div class="row"><div class="sample router green"></div> Router</div>
        <div class="row"><div class="sample circle green"></div> Client</div>
        
        <div class="section">CONNECTION</div>
        <div class="row"><div class="sample circle green"></div> Direct (hops=0)</div>
        <div class="row"><div class="sample circle green relay"></div> Relay (hops&gt;0)</div>
    </div>
</div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([52.4064, 16.9252], 11);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
            attribution:'© OSM'
        }).addTo(map);
        
        let markers = {};
        
        function timeAgo(timestamp) {
            const now = Math.floor(Date.now() / 1000);
            const diff = now - timestamp;
    
            if (diff < 60) return 'just now';
            if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
            if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
            return Math.floor(diff / 86400) + 'd ago';
        }
        
        function getMarkerClass(node) {
            const age = Math.floor(Date.now()/1000) - node.ts;
            let color = 'green';
            if (age > 21600) color = 'red';
            else if (age > 3600) color = 'yellow';
            const shape = (node.role === 'ROUTER' || node.role === 'ROUTER_LATE') ? 'router' : '';
            const relay = (node.hops > 0) ? 'relay' : '';
            return `marker ${color} ${shape} ${relay}`;
        }
        
        function update() {
            fetch('nodes.json?'+Date.now())
                .then(r=>r.json())
                .then(d=>{
                    document.getElementById('upd').textContent = 
                        new Date(d.updated).toLocaleTimeString('pl-PL');

                    // Calculate stats
                    let routers = 0, clients = 0, direct = 0, relay = 0, snrSum = 0, snrCount = 0;
                    // Detect overlapping nodes and add offset
                    function getOffset(node, allNodes) {
                        let offsetIndex = 0;
                        for (let other of allNodes) {
                            if (other.id === node.id) break;
                            if (Math.abs(other.lat - node.lat) < 0.0001 && 
                                Math.abs(other.lon - node.lon) < 0.0001) {
                                offsetIndex++;
                            }
                        }
                        // Offset in circle pattern
                        const angle = (offsetIndex * 137.5) * Math.PI / 180;
                        const distance = offsetIndex * 0.0002;
                        return {
                            lat: distance * Math.cos(angle),
                            lon: distance * Math.sin(angle)
                        };
                    }
                    // Filter nodes if checkbox is checked
                    const filterDirect = document.getElementById('filter-direct').checked;
                    const filteredNodes = filterDirect ? d.nodes.filter(n => n.hops === 0 && !n.via_mqtt) : d.nodes;
                    document.getElementById('cnt').textContent = filteredNodes.length;
                    filteredNodes.forEach(n => {
                        if (n.role === 'ROUTER' || n.role === 'ROUTER_LATE') routers++;
                        else clients++;
                        if (n.hops === 0) direct++;
                        else relay++;
                        if (n.snr) { snrSum += n.snr; snrCount++; }
                    });
                    document.getElementById('routers').textContent = routers;
                    document.getElementById('clients').textContent = clients;
                    document.getElementById('direct').textContent = direct;
                    document.getElementById('relay').textContent = relay;
                    document.getElementById('avgsnr').textContent = snrCount > 0 ? (snrSum/snrCount).toFixed(1) : '-';
                    document.getElementById('maxrange').textContent = d.max_distance_km || '-';
                    // Tracker info
                    if (d.tracker) {
                        document.getElementById('tracker-model').textContent = d.tracker.hw_model || '-';
                        document.getElementById('tracker-fw').textContent = d.tracker.firmware || '-';
                        document.getElementById('tracker-id').textContent = d.tracker.node_id || '-';
                        document.getElementById('tracker-port').textContent = d.tracker.port || '-';
                    }
                    
                    // Update no-GPS nodes panel
                    const noMqttNodes = (d.nodes_no_pos || []).filter(n => !n.via_mqtt);
                    const filteredNoGps = filterDirect ? noMqttNodes.filter(n => n.hops === 0) : noMqttNodes;
                    filteredNoGps.sort((a, b) => b.ts - a.ts);
                    document.getElementById('no-gps-cnt').textContent = filteredNoGps.length;
                    const noGpsList = document.getElementById('no-gps-list');
                    if (filteredNoGps.length > 0) {
                        noGpsList.innerHTML = filteredNoGps.map(n => {
                            const age = Math.floor(Date.now()/1000) - n.ts;
                            let dotColor = '#22c55e';
                            if (age > 21600) dotColor = '#ef4444';
                            else if (age > 3600) dotColor = '#eab308';
                            return `
                            <div class="no-gps-item">
                                <div class="name"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${dotColor};margin-right:5px;"></span>${n.name}</div>
                                <div class="meta">${n.id} | ${n.role}</div>
                                <div class="meta">SNR: ${n.snr} dB | hops: ${n.hops || 0} | ${timeAgo(n.ts)}</div>
                            </div>`;
                        }).join('');
                    } else {
                        noGpsList.innerHTML = '<div class="no-gps-item meta">No nodes</div>';
                    }
                    // Remove out of date
                    Object.keys(markers).forEach(id=>{
                        if(!filteredNodes.find(n=>n.id===id)){
                            map.removeLayer(markers[id]);
                            delete markers[id];
                        }
                    });
                    
                    // Add/update
                    filteredNodes.forEach(n=>{
                        const pop = `<div class="node-popup">
                            <b>${n.name}</b><br>
                            ${n.id}<br>
                            SNR: ${n.snr} dB<br>
                            Alt: ${n.alt}m<br>
                            Hops: ${n.hops || 0}<br>
                            <small>Seen: ${timeAgo(n.ts)}</small>
                        </div>`;
                        const offset = getOffset(n, d.nodes);
                        const displayLat = n.lat + offset.lat;
                        const displayLon = n.lon + offset.lon; 

                        if(markers[n.id]){
                            markers[n.id].setLatLng([displayLat, displayLon]);
                            markers[n.id].setIcon(L.divIcon({
                                className: getMarkerClass(n),
                                iconSize: [14, 14],
                                iconAnchor: [7, 7]
                            }));
                            markers[n.id].setPopupContent(pop);
                        }else{
                            markers[n.id] = L.marker([displayLat, displayLon], {
                                icon: L.divIcon({
                                    className: getMarkerClass(n),
                                    iconSize: [14, 14],
                                    iconAnchor: [7, 7]
                            })
                           })     .bindPopup(pop).addTo(map);
                        }
                    // Max range link - after markers are created
                    const maxLink = document.getElementById('maxrange-link');
                    if (d.farthest_node && markers[d.farthest_node]) {
                        const node = d.nodes.find(n => n.id === d.farthest_node);
                        maxLink.textContent = '(→ ' + (node ? node.name.substring(0,15) : d.farthest_node) + ')'; 
                        maxLink.style.display = 'inline';
                        maxLink.onclick = function(e) {
                            e.preventDefault();
                            const m = markers[d.farthest_node];
                            map.setView(m.getLatLng(), 14);
                            m.openPopup();
                        };
                    } else {
                        maxLink.style.display = 'none';
                    }
                    });
                })
                .catch(e=>console.error(e));
        }
        
        update();
        setInterval(update, 15000); // Co 15s
    </script>
</body>
</html>
