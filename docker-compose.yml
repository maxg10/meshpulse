services:
  meshpulse:
    image: mgieparda/meshpulse:latest
    build: .
    container_name: meshpulse
    restart: unless-stopped
    ports:
      - "80:80"
      - "8765:8765"
    environment:
      - TRACKER_HOST=${TRACKER_HOST:-}
    volumes:
      - mapper-data:/var/www/html/meshtastic

volumes:
  mapper-data:
