name: SBOM

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Add Syft to PATH
        env:
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
        run: ln -sf "$SYFT_CMD" /usr/local/bin/syft

      - name: Generate SBOM (CycloneDX JSON)
        run: syft dir:. --source-name meshpulse --source-version "${GITHUB_REF_NAME}" -o cyclonedx-json > meshpulse-${GITHUB_REF_NAME}-sbom.cdx.json

      - name: Generate SBOM (SPDX JSON)
        run: syft dir:. --source-name meshpulse --source-version "${GITHUB_REF_NAME}" -o spdx-json > meshpulse-${GITHUB_REF_NAME}-sbom.spdx.json

      - name: Upload SBOMs to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" meshpulse-*-sbom.*.json --clobber

      - name: Upload SBOMs as workflow artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: meshpulse-*-sbom.*.json
