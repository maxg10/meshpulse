server.modules = (
    "mod_access",
    "mod_alias",
    "mod_redirect"
)

server.document-root        = "/var/www/html"
server.upload-dirs          = ( "/var/cache/lighttpd/uploads" )
server.errorlog             = "/var/log/lighttpd/error.log"
server.pid-file             = "/run/lighttpd.pid"
server.port                 = 80

index-file.names            = ( "index.html" )
url.access-deny             = ( "~", ".inc" )

# config.json lives in the web root because that is where the backend keeps its
# state, but it is storage, not a public asset: the frontend never fetches it
# (settings travel over the WebSocket) while it can hold a broker host, tokens
# and an API key. Serving it would publish all of that to anyone who can open
# the map.
$HTTP["url"] =~ "^/meshpulse/config\.json$" {
    url.access-deny = ( "" )
}
static-file.exclude-extensions = ( ".php", ".pl", ".fcgi" )

$HTTP["url"] =~ "^/$" {
    url.redirect = ( "^/" => "/meshpulse/" )
}
$HTTP["url"] =~ "^/meshtastic(/.*)?$" {
    url.redirect = ( "^/meshtastic(/.*)?$" => "/meshpulse$1" )
}
